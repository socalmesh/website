name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build under the GitHub Pages sub-folder on purpose: it catches internal links
# that were written as "/help/" instead of going through src/lib/url.ts.
env:
  SITE_URL: https://socalmesh.github.io
  BASE_PATH: /website

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # One check called "Checks" appears on the pull request; open its log to see
      # which of the steps below failed. Types are checked first because that is the
      # fastest failure, and every step runs even if an earlier one failed, so one
      # push tells you about all of the problems rather than the first one.
      - name: Types and content
        run: npm run check

      # Small tests for the helper code and for the check scripts themselves. They
      # use Node's own test runner, so there is nothing extra to install.
      - name: Helper tests
        if: '!cancelled()'
        run: npm test

      - name: Build
        if: '!cancelled()'
        run: npm run build

      - name: Internal links
        if: '!cancelled()'
        run: node scripts/check-links.mjs --dist dist --base "$BASE_PATH"

      # Reads the pages that were just built: one title and one main heading each,
      # no id used twice, and every link to a section landing on a real section.
      - name: Finished pages
        if: '!cancelled()'
        run: node scripts/check-pages.mjs --dist dist --base "$BASE_PATH"

      # The page-weight budget: fails if a picture, a script or a whole page got
      # heavier than the limits at the top of scripts/check-weight.mjs.
      - name: Page weight
        if: '!cancelled()'
        run: node scripts/check-weight.mjs --dist dist --base "$BASE_PATH"

      # Opens every built page in the Chrome that is already on this machine, at a
      # desktop and a phone width, and fails on any accessibility problem it finds.
      # The browser cannot reach the internet while it does this.
      - name: Accessibility
        if: '!cancelled()'
        run: node scripts/check-a11y.mjs --dist dist --base "$BASE_PATH"

      # The built site, downloadable from the pull request. There are no preview
      # deployments on this repo, so this is how someone looks at a change before
      # it goes live.
      - name: Upload the built site
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7
